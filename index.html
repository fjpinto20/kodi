<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kodi Addons</title>
    <meta name="description" content="Repositório de addons para Kodi">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #1e3a5f 0%, #111827 45%, #080c14 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 70px 20px 45px;
        }

        header h1 {
            margin: 0;
            font-size: 46px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        header p {
            margin: 14px 0 0;
            color: #9ca3af;
            font-size: 18px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .search {
            margin-bottom: 30px;
        }

        .search input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 12px;
            border: 1px solid #374151;
            background: rgba(31, 41, 55, 0.85);
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        .search input:focus {
            border-color: #3b82f6;
        }

        .search input::placeholder {
            color: #6b7280;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(31, 41, 55, 0.92);
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 24px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #4b5563;
        }

        .icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #2563eb;
            font-size: 24px;
            margin-bottom: 18px;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .filename {
            color: #9ca3af;
            font-size: 13px;
            word-break: break-all;
            margin-bottom: 16px;
        }

        .description {
            color: #d1d5db;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .download {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .download:hover {
            background: #1d4ed8;
        }

        .empty {
            display: none;
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        footer {
            text-align: center;
            padding: 60px 20px 35px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header {
                padding: 50px 20px 35px;
            }

            header h1 {
                font-size: 36px;
            }

            header p {
                font-size: 16px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Kodi Addons</h1>
    <p>Downloads de addons para Kodi</p>
</header>

<main class="container">

    <div class="search">
        <input
            type="search"
            id="search"
            placeholder="Pesquisar addon..."
            autocomplete="off"
        >
    </div>

    <div class="grid" id="addons">

        <div class="card" data-name="repository.acestream-channels">

            <div class="icon">
                K
            </div>

            <h2>Acestream Channels</h2>

            <div class="filename">
                repository.acestream-channels.zip
            </div>

            <div class="description">
                Repositório do addon Acestream Channels para Kodi.
            </div>

            <a
                class="download"
                href="repository.acestream-channels.zip"
                download
            >
                Download ZIP
            </a>

        </div>

    </div>

    <div class="empty" id="empty">
        Nenhum addon encontrado.
    </div>

</main>

<footer>
    Kodi Addons
</footer>

<script>
    const search = document.getElementById("search");
    const cards = document.querySelectorAll(".card");
    const empty = document.getElementById("empty");

    search.addEventListener("input", function () {

        const query = this.value.toLowerCase().trim();
        let visible = 0;

        cards.forEach(function (card) {

            const name = card.dataset.name.toLowerCase();

            if (name.includes(query)) {
                card.style.display = "";
                visible++;
            } else {
                card.style.display = "none";
            }

        });

        empty.style.display = visible === 0 ? "block" : "none";

    });
</script>

</body>
</html>
