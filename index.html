<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kodi Addons</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            color: #9ca3af;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .search {
            margin-bottom: 30px;
        }

        .search input {
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #1f2937;
            color: white;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
        }

        .version {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .description {
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .download {
            display: block;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .download:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

    </style>

</head>

<body>

<header>

    <h1>Kodi Addons</h1>

    <p>
        Downloads de addons para Kodi
    </p>

</header>

<main class="container">

    <div class="search">

        <input
            type="search"
            placeholder="Pesquisar addon..."
        >

    </div>

    <div class="grid">

        <div class="card">

            <h2>Exemplo</h2>

            <div class="version">
                Versão 1.0.0
            </div>

            <div class="description">
                Exemplo de addon Kodi.
            </div>

            <a
                class="download"
                href="#"
            >
                Download ZIP
            </a>

        </div>

    </div>

</main>

<footer>

    Kodi Addons

</footer>

</body>

</html>
