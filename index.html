<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kodi Addons</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 7px;
            margin-bottom: 35px;
            color: #777;
            font-size: 14px;
        }

        .search {
            margin-bottom: 20px;
        }

        .search input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fafafa;
            font-size: 14px;
            outline: none;
        }

        .search input:focus {
            border-color: #aaa;
            background: #fff;
        }

        .list {
            border-top: 1px solid #ddd;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 14px 4px;

            border-bottom: 1px solid #e5e5e5;
        }

        .filename {
            color: #333;
            font-size: 14px;
            word-break: break-all;
        }

        .download {
            flex-shrink: 0;

            color: #666;
            text-decoration: none;
            font-size: 13px;
        }

        .download:hover {
            color: #000;
            text-decoration: underline;
        }

        .status {
            padding: 25px 0;
            color: #888;
            font-size: 14px;
        }

        footer {
            margin-top: 40px;
            color: #aaa;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 30px 15px;
            }

            .row {
                align-items: flex-start;
            }

            .download {
                white-space: nowrap;
            }

        }
    </style>
</head>

<body>

<div class="container">

    <h1>Kodi Addons</h1>

    <div class="subtitle">
        Addons e repositórios para Kodi
    </div>

    <div class="search">
        <input
            type="search"
            id="search"
            placeholder="Pesquisar ficheiros..."
            autocomplete="off"
        >
    </div>

    <div id="status" class="status">
        A carregar...
    </div>

    <div id="list" class="list"></div>

    <footer>
        Kodi Addons
    </footer>

</div>


<script>

const USER = "fjpinto20";
const REPOSITORY = "kodi";

const API_URL =
    `https://api.github.com/repos/${USER}/${REPOSITORY}/contents/`;

const list = document.getElementById("list");
const status = document.getElementById("status");
const search = document.getElementById("search");

let files = [];


/* Carregar ficheiros */

async function loadFiles() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Erro ao consultar o GitHub");
        }

        const data = await response.json();

        files = data
            .filter(file =>
                file.type === "file" &&
                file.name.toLowerCase().endsWith(".zip")
            )
            .sort((a, b) =>
                a.name.localeCompare(b.name)
            );

        status.style.display = "none";

        renderFiles();

    }

    catch (error) {

        status.textContent =
            "Não foi possível carregar os ficheiros.";

        console.error(error);

    }

}


/* Mostrar ficheiros */

function renderFiles(filter = "") {

    list.innerHTML = "";

    const filtered = files.filter(file =>
        file.name.toLowerCase().includes(
            filter.toLowerCase()
        )
    );


    if (filtered.length === 0) {

        list.innerHTML = `
            <div class="status">
                Nenhum ficheiro encontrado.
            </div>
        `;

        return;

    }


    filtered.forEach(file => {

        const row = document.createElement("div");

        row.className = "row";

        const url =
            `https://${USER}.github.io/${REPOSITORY}/${encodeURIComponent(file.name)}`;

        row.innerHTML = `

            <div class="filename">
                ${file.name}
            </div>

            <a
                class="download"
                href="${url}"
                download
            >
                Download
            </a>

        `;

        list.appendChild(row);

    });

}


/* Pesquisa */

search.addEventListener("input", function () {

    renderFiles(this.value);

});


/* Iniciar */

loadFiles();

</script>

</body>
</html>
