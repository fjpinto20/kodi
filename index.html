<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kodi Addons</title>
    <meta name="description" content="Addons e repositórios para Kodi">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f7f7f8;
            color: #222;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 600;
            color: #111;
        }

        .subtitle {
            margin-top: 5px;
            color: #777;
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .search {
            margin-bottom: 25px;
        }

        .search input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        .search input:focus {
            border-color: #999;
        }

        .addons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .addon {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 17px 18px;
        }

        .addon-info {
            min-width: 0;
        }

        .addon-name {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-bottom: 5px;
        }

        .addon-file {
            color: #888;
            font-size: 13px;
            word-break: break-all;
        }

        .download {
            flex-shrink: 0;

            display: inline-block;
            padding: 9px 14px;

            border: 1px solid #d5d5d5;
            border-radius: 6px;

            background: #fff;
            color: #333;

            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .download:hover {
            background: #f3f3f3;
        }

        .status {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 14px;
        }

        footer {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 30px;

            color: #999;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            .addon {
                align-items: flex-start;
            }

            .download {
                margin-top: 2px;
            }

            .addon-name {
                font-size: 15px;
            }

        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">Kodi Addons</div>
        <div class="subtitle">Addons e repositórios para Kodi</div>
    </div>
</header>

<main>

    <div class="search">
        <input
            type="search"
            id="search"
            placeholder="Pesquisar..."
            autocomplete="off"
        >
    </div>

    <div id="status" class="status">
        A carregar...
    </div>

    <div id="addons" class="addons"></div>

</main>

<footer>
    Kodi Addons
</footer>


<script>

const USER = "fjpinto20";
const REPOSITORY = "kodi";

const API_URL =
    `https://api.github.com/repos/${USER}/${REPOSITORY}/contents/`;

const addonsContainer =
    document.getElementById("addons");

const status =
    document.getElementById("status");

const search =
    document.getElementById("search");

let addons = [];


/* Nome apresentado no site */

function getAddonName(filename) {

    let name = filename
        .replace(/\.zip$/i, "")
        .replace(/^repository\./i, "")
        .replace(/^plugin\./i, "");

    name = name.replace(/[._-]+/g, " ");

    return name
        .split(" ")
        .map(word =>
            word.charAt(0).toUpperCase() + word.slice(1)
        )
        .join(" ");
}


/* Mostrar addons */

function renderAddons(filter = "") {

    addonsContainer.innerHTML = "";

    const filtered = addons.filter(addon =>
        addon.name.toLowerCase().includes(filter.toLowerCase()) ||
        addon.filename.toLowerCase().includes(filter.toLowerCase())
    );


    if (filtered.length === 0) {

        addonsContainer.innerHTML = `
            <div class="status">
                Nenhum addon encontrado.
            </div>
        `;

        return;
    }


    filtered.forEach(addon => {

        const element = document.createElement("div");

        element.className = "addon";

        element.innerHTML = `

            <div class="addon-info">

                <div class="addon-name">
                    ${addon.name}
                </div>

                <div class="addon-file">
                    ${addon.filename}
                </div>

            </div>

            <a
                class="download"
                href="${addon.url}"
                download
            >
                Download
            </a>

        `;

        addonsContainer.appendChild(element);

    });
}


/* Obter ZIPs do GitHub */

async function loadAddons() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Erro ao consultar GitHub");
        }

        const files = await response.json();


        addons = files
            .filter(file =>
                file.type === "file" &&
                file.name.toLowerCase().endsWith(".zip")
            )
            .map(file => ({

                filename: file.name,

                name: getAddonName(file.name),

                url:
                    `https://${USER}.github.io/${REPOSITORY}/${encodeURIComponent(file.name)}`
            }));


        status.style.display = "none";

        renderAddons();

    }

    catch (error) {

        status.innerHTML =
            "Não foi possível carregar os addons.";

        console.error(error);

    }
}


/* Pesquisa */

search.addEventListener("input", function () {

    renderAddons(this.value);

});


/* Iniciar */

loadAddons();

</script>

</body>
</html>
