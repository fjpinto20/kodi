<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kodi Addons</title>

    <meta
        name="description"
        content="Downloads de addons para Kodi"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #080b10,
                    #111827
                );

            color: #fff;

            min-height: 100vh;
        }


        header {

            padding: 60px 20px 40px;

            text-align: center;
        }


        header h1 {

            margin: 0;

            font-size: 42px;

            font-weight: 700;
        }


        header p {

            margin-top: 10px;

            color: #9ca3af;

            font-size: 16px;
        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding:
                0 20px 60px;
        }


        .search {

            margin-bottom: 30px;
        }


        .search input {

            width: 100%;

            padding: 15px 18px;

            border-radius: 12px;

            border:
                1px solid #374151;

            background: #111827;

            color: white;

            font-size: 16px;

            outline: none;
        }


        .search input:focus {

            border-color: #6b7280;
        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 20px;
        }


        .card {

            background:
                rgba(17, 24, 39, .95);

            border:
                1px solid #273244;

            border-radius: 16px;

            overflow: hidden;

            transition:
                transform .2s,
                border-color .2s;
        }


        .card:hover {

            transform:
                translateY(-4px);

            border-color:
                #4b5563;
        }


        .icon {

            height: 150px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #0f172a;
        }


        .icon img {

            max-width: 90px;

            max-height: 90px;

            border-radius: 18px;
        }


        .default-icon {

            font-size: 55px;

            opacity: .7;
        }


        .content {

            padding: 20px;
        }


        .content h2 {

            margin:
                0 0 8px;

            font-size: 19px;
        }


        .version {

            color: #9ca3af;

            font-size: 13px;

            margin-bottom: 12px;
        }


        .description {

            color: #d1d5db;

            font-size: 14px;

            line-height: 1.5;

            min-height: 42px;

            margin-bottom: 18px;
        }


        .download {

            display: block;

            text-align: center;

            padding: 11px 15px;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            font-weight: 600;
        }


        .download:hover {

            background: #1d4ed8;
        }


        footer {

            text-align: center;

            padding: 30px 20px;

            color: #6b7280;

            font-size: 13px;
        }


        @media (max-width: 600px) {

            header {

                padding-top: 40px;
            }

            header h1 {

                font-size: 32px;
            }

            .grid {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>Kodi Addons</h1>

    <p>
        Addons disponíveis para download
    </p>

</header>


<main class="container">


    <div class="search">

        <input
            type="search"
            id="search"
            placeholder="Pesquisar addon..."
            autocomplete="off"
        >

    </div>


    <div
        class="grid"
        id="addons"
    ></div>


</main>


<footer>

    Kodi Addons

</footer>


<script>

    const container =
        document.getElementById("addons");

    const search =
        document.getElementById("search");

    let addons = [];


    fetch("addons.json")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Erro ao carregar addons.json"
                );

            }

            return response.json();

        })

        .then(data => {

            addons = data;

            render(addons);

        })

        .catch(error => {

            console.error(error);

            container.innerHTML = `

                <p style="
                    color:#9ca3af;
                    grid-column:1/-1;
                    text-align:center;
                ">

                    Não foi possível
                    carregar os addons.

                </p>

            `;

        });


    function render(list) {

        container.innerHTML = "";


        if (list.length === 0) {

            container.innerHTML = `

                <p style="
                    color:#9ca3af;
                    grid-column:1/-1;
                    text-align:center;
                ">

                    Nenhum addon encontrado.

                </p>

            `;

            return;
        }


        list.forEach(addon => {

            const card =
                document.createElement("article");

            card.className = "card";


            const icon =
                addon.icon

                ?

                `<img
                    src="${addon.icon}"
                    alt="${addon.name}"
                    loading="lazy"
                >`

                :

                `<div class="default-icon">
                    📦
                </div>`;


            card.innerHTML = `

                <div class="icon">

                    ${icon}

                </div>


                <div class="content">

                    <h2>
                        ${addon.name}
                    </h2>


                    <div class="version">

                        Versão ${addon.version}

                    </div>


                    <div class="description">

                        ${addon.description}

                    </div>


                    <a
                        class="download"
                        href="${addon.file}"
                        download
                    >

                        Download ZIP

                    </a>

                </div>

            `;


            container.appendChild(card);

        });

    }


    search.addEventListener(
        "input",
        function () {

            const query =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                addons.filter(addon =>

                    addon.name
                        .toLowerCase()
                        .includes(query)

                    ||

                    addon.description
                        .toLowerCase()
                        .includes(query)

                );


            render(filtered);

        }
    );

</script>


</body>

</html>
